<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop • Petal & Wisp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* Shared styles identical to index.html – abbreviated for brevity but must be included */
    * { margin: 0; padding: 0; box-sizing: border-box; } body { font-family: 'Montserrat', sans-serif; background: #fff9f5; color: #3a2a20; } .container { max-width: 1280px; margin: 0 auto; padding: 0 24px; } :root { --pink: #f2b8c6; --brown: #7a5a4a; --cream: #fff9f5; --white: #ffffff; --dark: #3a2a20; } @keyframes fadeUp { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } } .navbar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 24px 0; border-bottom: 1px solid #e2d5cc; } .logo { font-family: 'Cormorant', serif; font-size: 2.4rem; font-weight: 600; color: var(--brown); } .nav-links { display: flex; gap: 8px; flex-wrap: wrap; } .nav-links a { text-decoration: none; font-weight: 500; color: var(--dark); padding: 10px 18px; border-radius: 40px; } .nav-links a.active { background: var(--pink); } .cart-icon { background: var(--brown); color: white !important; } #cartCount { background: var(--pink); color: var(--dark); border-radius: 20px; padding: 2px 8px; } .page-content { padding: 40px 0; } h1, h2 { font-family: 'Cormorant', serif; } .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 30px; } .product-card { background: white; border-radius: 24px; padding: 20px; border: 2px solid var(--brown); box-shadow: 8px 8px 0 var(--pink); cursor: pointer; opacity: 0; animation: fadeUp 0.5s forwards; } .product-card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 16px; border: 2px solid var(--brown); } .product-name { font-family: 'Cormorant', serif; font-size: 1.6rem; } .product-price { font-weight: 700; color: var(--brown); } .buy-btn { background: var(--brown); color: white; border: none; padding: 10px 20px; border-radius: 40px; cursor: pointer; } .btn { display: inline-block; background: var(--brown); color: white; padding: 16px 36px; border-radius: 50px; text-decoration: none; } .modal { /* same as index */ } .footer { border-top: 2px solid var(--pink); padding: 40px 0; }
    /* Full styles should be copied from index for consistency */
  </style>
</head>
<body>
<div class="container">
  <header>
    <div class="navbar">
      <div class="logo">PETAL & WISP<span>parfum</span></div>
      <div class="nav-links">
        <a href="index.html"><i class="fas fa-home"></i> Home</a>
        <a href="shop.html" class="active"><i class="fas fa-store"></i> Shop</a>
        <a href="about.html"><i class="fas fa-leaf"></i> About</a>
        <a href="contact.html"><i class="fas fa-envelope"></i> Contact</a>
        <a href="checkout.html"><i class="fas fa-shopping-bag"></i> Checkout</a>
        <a href="#" class="cart-icon" id="cartWidget"><i class="fas fa-shopping-cart"></i> <span id="cartCount">0</span></a>
      </div>
    </div>
  </header>

  <main class="page-content">
    <h1 style="font-size:3.5rem; margin-bottom:20px;">All Fragrances</h1>
    <p style="margin-bottom:30px;">Explore our curated collection of feminine perfumes.</p>
    <div class="product-grid" id="shopGrid"></div>
  </main>

  <footer class="footer">
    <div>© 2026 Petal & Wisp</div>
    <div><i class="fab fa-instagram"></i> <i class="fab fa-pinterest"></i></div>
  </footer>
</div>

<!-- Modal same as index -->
<div class="modal" id="productModal">
  <div class="modal-content">
    <span class="modal-close" id="closeModalBtn">&times;</span>
    <img id="modalImg" style="width:100%; max-height:300px; object-fit:cover; border-radius:20px; border:2px solid var(--brown);" src="" alt="">
    <div style="margin-top:20px;">
      <h2 id="modalName" style="font-size:2.2rem;"></h2>
      <p id="modalNotes" style="color: var(--brown);"></p>
      <p id="modalDesc"></p>
      <p id="modalPrice" style="font-size:1.8rem;"></p>
      <div style="display:flex; gap:12px; margin-top:20px;">
        <button class="btn" id="modalBuyBtn">BUY NOW</button>
        <button class="btn btn-outline" id="modalAddCartBtn">ADD TO CART</button>
        <a href="#" id="modalDetailLink" class="btn btn-outline">FULL DETAILS →</a>
      </div>
    </div>
  </div>
</div>

<script src="shared.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (typeof renderProductGrid === 'function') {
      renderProductGrid('shopGrid', perfumeData);
    }
  });
</script>
</body>
</html>
