<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact • Petal & Wisp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* shared styles */ * { margin:0; padding:0; } body { font-family:'Montserrat',sans-serif; background:#fff9f5; } .container { max-width:1280px; margin:0 auto; padding:0 24px; } :root { --pink:#f2b8c6; --brown:#7a5a4a; } .navbar { display:flex; align-items:center; justify-content:space-between; padding:24px 0; } .logo { font-family:'Cormorant',serif; font-size:2.4rem; color:var(--brown); } .nav-links a { text-decoration:none; padding:10px 18px; } .cart-icon { background:var(--brown); color:white; } .contact-card { background:white; border-radius:40px; padding:40px; border:2px solid var(--brown); box-shadow:15px 15px 0 var(--pink); } .btn { background:var(--brown); color:white; padding:16px 36px; border-radius:50px; border:none; cursor:pointer; } .footer { border-top:2px solid var(--pink); padding:40px 0; }
  </style>
</head>
<body>
<div class="container">
  <header>
    <div class="navbar">
      <div class="logo">PETAL & WISP<span>parfum</span></div>
      <div class="nav-links">
        <a href="index.html">Home</a><a href="shop.html">Shop</a><a href="about.html">About</a><a href="contact.html" class="active">Contact</a><a href="checkout.html">Checkout</a>
        <a href="#" class="cart-icon" id="cartWidget"><i class="fas fa-shopping-cart"></i> <span id="cartCount">0</span></a>
      </div>
    </div>
  </header>
  <main class="page-content">
    <div class="contact-card fade-up">
      <h1 style="font-size:3rem;">Get in Touch</h1>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:30px; margin-top:30px;">
        <div><p><i class="fas fa-map-pin"></i> 12 Blossom Lane, London</p><p><i class="fas fa-phone"></i> +44 20 7946 0138</p><p><i class="fas fa-envelope"></i> hello@petalandwisp.com</p></div>
        <div><input placeholder="Name" style="width:100%; padding:14px; border:2px solid var(--brown); border-radius:30px; margin-bottom:16px;"><input placeholder="Email" style="width:100%; padding:14px; border:2px solid var(--brown); border-radius:30px; margin-bottom:16px;"><textarea placeholder="Message" rows="3" style="width:100%; padding:14px; border:2px solid var(--brown); border-radius:30px;"></textarea><button class="btn" style="margin-top:16px;">Send Message</button></div>
      </div>
    </div>
  </main>
  <footer class="footer"><div>© 2026 Petal & Wisp</div><div><i class="fab fa-instagram"></i></div></footer>
</div>
<script src="shared.js"></script>
</body>
</html>
