<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product • Petal & Wisp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* Copy full styles from index.html – ensure consistency */
    * { margin: 0; padding: 0; box-sizing: border-box; } body { font-family: 'Montserrat', sans-serif; background: #fff9f5; } .container { max-width: 1280px; margin: 0 auto; padding: 0 24px; } :root { --pink: #f2b8c6; --brown: #7a5a4a; } .navbar { display: flex; align-items: center; justify-content: space-between; padding: 24px 0; } .logo { font-family: 'Cormorant', serif; font-size: 2.4rem; color: var(--brown); } .nav-links a { text-decoration: none; padding: 10px 18px; } .cart-icon { background: var(--brown); color: white; } .page-content { padding: 40px 0; } .product-detail { display: flex; flex-wrap: wrap; gap: 40px; } .product-img { flex:1; min-width:280px; } .product-img img { width:100%; border-radius:30px; border:2px solid var(--brown); box-shadow:15px 15px 0 var(--pink); } .product-info { flex:1; } .btn { background: var(--brown); color: white; padding: 16px 36px; border-radius:50px; text-decoration:none; display:inline-block; margin-right:12px; } .footer { border-top:2px solid var(--pink); padding:40px 0; }
  </style>
</head>
<body>
<div class="container">
  <header>
    <div class="navbar">
      <div class="logo">PETAL & WISP<span>parfum</span></div>
      <div class="nav-links">
        <a href="index.html">Home</a><a href="shop.html">Shop</a><a href="about.html">About</a><a href="contact.html">Contact</a><a href="checkout.html">Checkout</a>
        <a href="#" class="cart-icon" id="cartWidget"><i class="fas fa-shopping-cart"></i> <span id="cartCount">0</span></a>
      </div>
    </div>
  </header>

  <main class="page-content" id="productDetailContainer">
    <!-- dynamically filled -->
  </main>

  <footer class="footer">
    <div>© 2026 Petal & Wisp</div><div><i class="fab fa-instagram"></i></div>
  </footer>
</div>
<script src="shared.js"></script>
<script>
  function getProductIdFromUrl() {
    const params = new URLSearchParams(window.location.search);
    return params.get('id');
  }
  document.addEventListener('DOMContentLoaded', () => {
    const id = getProductIdFromUrl();
    const product = perfumeData.find(p => p.id === id) || perfumeData[0];
    const container = document.getElementById('productDetailContainer');
    container.innerHTML = `
      <div class="product-detail fade-up">
        <div class="product-img"><img src="${product.image}" alt="${product.name}"></div>
        <div class="product-info">
          <h1 style="font-size:3rem; font-family:'Cormorant';">${product.name}</h1>
          <p style="color:var(--brown); font-size:1.2rem;">${product.notes}</p>
          <p style="margin:20px 0;">${product.fullDesc || product.desc}</p>
          <p style="font-size:2rem; font-weight:700;">$${product.price}</p>
          <div style="margin-top:30px;">
            <button class="btn" id="detailBuyBtn">BUY NOW</button>
            <button class="btn" style="background:transparent; color:var(--brown); box-shadow:none;" id="detailAddCartBtn">ADD TO CART</button>
          </div>
        </div>
      </div>
    `;
    document.getElementById('detailBuyBtn').addEventListener('click', () => { addToCart(product); window.location.href='checkout.html'; });
    document.getElementById('detailAddCartBtn').addEventListener('click', () => { addToCart(product); updateCartCount(); });
  });
</script>
</body>
</html>
